version: '3.8'

services:
  frontend:
    build:
      context: ./task-scheduler-frontend
      dockerfile: Dockerfile
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=http://localhost/api
      - NEXT_PUBLIC_GRAPHQL_URL=http://localhost/graphql
    depends_on:
      - backend
    networks:
      - app-network

  backend:
    build:
      context: ./task-scheduler-backend
      dockerfile: Dockerfile
    environment:
      - RUST_LOG=info
      - DATABASE_URL=postgres://postgres:postgres@db:5432/taskdb
      - JWT_SECRET=your_jwt_secret_here
      - CORS_ORIGIN=http://localhost
    depends_on:
      - db
    networks:
      - app-network

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      - frontend
      - backend
    networks:
      - app-network

  db:
    image: postgres:14-alpine
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=taskdb
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  postgres_data:
