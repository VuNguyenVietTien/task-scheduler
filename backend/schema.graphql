	reorder_project_catalog_items(input: ReorderProjectCatalogItemsInput!): [ProjectCatalogItem!]!
	"""
	Create a resource identity. With no user_id this is a PLACEHOLDER:
	stable ID, required display name, optional email, no fabricated user.
	"""
	create_resource_member(input: CreateResourceMemberInput!): ResourceMemberType!
	"""
	Link a user to an existing resource member. The member ID never
	changes; a duplicate linked user (same project) is an explicit error.
	"""
	link_resource_member_user(resource_member_id: ID!, user_id: ID!): ResourceMemberType!
	"""
	Link by an existing account email. This intentionally does not grant
	access: `role` stays NULL until the explicit access mutation is used.
	"""
	link_resource_member_by_email(resource_member_id: ID!, email: String!): ResourceMemberType!
	"""
	Explicitly set/revoke project access without deleting the scheduling
	identity. A NULL role revokes access only.
	"""
	set_project_member_access(resource_member_id: ID!, role: String): ResourceMemberType!
	"""
	Remove a canonical member. Scheduling configuration cascades; assigned members are rejected.
	"""
	remove_resource_member(project_id: ID!, member_id: ID!): Boolean!
	"""
	Transfer ownership to another linked project member. Owner only.
	"""
	transfer_project_ownership(project_id: ID!, new_owner_user_id: ID!): Boolean!
	"""
	Classify a concrete MEMBER by a COMPANY/GROUP of the same project.
	Classification only: no assignment/capacity semantics.
	"""
	classify_resource_member(resource_member_id: ID!, classified_by_resource_member_id: ID!): Boolean!
	"""
	R3: set a member's default weekday/weekend hours (persisted).
	"""
	set_member_capacity(input: SetMemberCapacityInput!): MemberCapacity!
	"""
	R3: set an explicit per-date hours override (e.g. working Saturday 8h
	or a 0h weekday). Upsert per (member, date).
	"""
	set_capacity_date_override(input: CapacityDateOverrideInput!): MemberCapacity!
	"""
	R3: add a day off (individual / group / project scope).
	"""
	add_day_off(input: AddDayOffInput!): DayOff!
	"""
	R3: remove a day off.
	"""
	remove_day_off(id: ID!): Boolean!
	create_resource_group(project_id: ID!, name: String!): ResourceGroup!
	delete_resource_group(id: ID!): Boolean!
	"""
	Add resource members to a group (idempotent). Returns the new size.
	"""
	add_resource_group_members(group_id: ID!, member_ids: [ID!]!): Int!
	remove_resource_group_member(group_id: ID!, member_id: ID!): Boolean!
	"""
	R4: expand a group into `project_members` rows — every LINKED group
	member's user gets project membership (placeholders skipped). Atomic +
	idempotent; returns the number of users actually added.
	"""
	add_project_members_by_group(group_id: ID!, role: MemberRole): Int!
	create_recurring_commitment(input: CreateRecurringCommitmentInput!): RecurringCommitment!
	delete_recurring_commitment(id: ID!): Boolean!
	"""
	Batch-save the caller's timesheet entries. Upsert semantics on
	(user_id, task_id, work_date): re-saving a day overwrites the stored
	hours — duplicates are impossible. Per-row failures are returned (not
	thrown) so one bad row never loses the valid ones.
	"""
	save_timesheet_batch(input: SaveTimesheetBatchInput!): TimesheetBatchResult!
	"""
	Save a client-computed draft as a snapshot. NEVER implicitly
	overwrites an existing plan: no plan_id → new plan (revision 1);
	plan_id + NEW_REVISION → appended revision row (old row retained);
	plan_id + SAME_REVISION → explicit in-place overwrite of that row.
	"""
	save_plan_snapshot(input: SavePlanSnapshotInput!): SavedPlan!
}

