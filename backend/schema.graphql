	"""
	deletePlan(id: String!): Boolean!
	"""
	Đặt plan là active
	"""
	setPlanActive(id: String!): Plan!
	"""
	Alias of createPlan for snake_case (web SDL) clients
	"""
	create_plan(input: CreatePlanInput!): Plan!
	"""
	Alias of updatePlan for snake_case (web SDL) clients
	"""
	update_plan(input: UpdatePlanInput!): Plan!
	"""
	Alias of deletePlan for snake_case (web SDL) clients
	"""
	delete_plan(id: String!): Boolean!
	"""
	Alias of setPlanActive for snake_case (web SDL) clients
	"""
	set_plan_active(id: String!): Plan!
	create_notification(input: CreateNotificationInput!): Notification!
	mark_notification_as_read(notification_id: ID!): Notification!
	mark_all_notifications_as_read: Boolean!
	"""
	(Re-)apply the exact five default phases (idempotent; seeds new
	projects, verifies existing ones).
	"""
	ensure_default_phases(project_id: ID!): Int!
	"""
	Create a project phase (project-local key/order uniqueness enforced).
	"""
	create_project_phase(input: CreateTermInput!): ProjectPhaseType!
	"""
	Edit a phase's order/color/translations (labels are never identifiers).
	"""
	update_project_phase_translations(input: UpdateTermTranslationsInput!): ProjectPhaseType!
	"""
	Archive a phase. Referencing tasks must be atomically reassigned or
	explicitly converted to Unphased (ArchiveStrategyInput).
	"""
	archive_project_phase(project_id: ID!, phase_id: ID!, strategy: ArchiveStrategyInput!): Int!
	"""
	Assign a task's phase/category. Both terms must belong to the task's
	project and be active; NULL explicitly means Unphased/uncategorised.
	"""
	set_task_taxonomy(task_id: ID!, phase_id: ID, category_id: ID): Boolean!
