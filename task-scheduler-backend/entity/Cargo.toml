[package]
name = "entity"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "entity"
path = "src/lib.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
sea-orm = { version = "0.12", features = [ "sqlx-postgres", "runtime-tokio-native-tls", "with-uuid", "with-json", "with-chrono" ] }
chrono = "0.4"
uuid = { version = "1.0", features = ["serde", "v4"] }