# Schema Types

"""
User role in the system
"""
enum UserRole {
    admin
    manager
    member
}

"""
Task priority level
"""
enum TaskPriority {
    low
    medium
    high
    urgent
    critical
}

"""
Task status
"""
enum TaskStatus {
    todo
    doing
    done
    close
    pending
    review
    blocked
    rejected
    archived
}

"""
Project member role
"""
enum ProjectRole {
    owner
    manager
    editor
    viewer
}

"""
Project status
"""
enum ProjectStatus {
    active
    completed
    cancelled
    on_hold
}

"""
Project priority
"""
enum ProjectPriority {
    low
    medium
    high
    urgent
}

"""
Project visibility
"""
enum ProjectVisibility {
    public
    private
    team
}

"""
Task progress type
"""
enum TaskProgressType {
    not_started
    in_progress
    completed
    blocked
    on_hold
}

"""
Notification type
"""
enum NotificationType {
    task_assigned
    task_updated
    comment_added
    project_invitation
    deadline_reminder
}

# Queries

type Query {
  """
  Get current authenticated user
  """
  me: User!

  """
  Get a specific user by ID
  """
  user(userId: ID!): User

  """
  Get a list of users with optional filters
  """
  users(role: UserRole): [User!]!

  """
  Get a specific project by ID
  """
  project(projectId: ID!): Project

  """
  Get all accessible projects for current user
  """
  projects: [Project!]!

  """
  Get a specific task by ID
  """
  task(taskId: ID!): Task

  """
  Get tasks with optional filters
  """
  tasks(
    projectId: ID
    status: TaskStatus
    assigneeId: ID
  ): [Task!]!

  """
  Get notifications for current user
  """
  notifications(includeRead: Boolean = false): [Notification!]!

  """
  Get count of unread notifications
  """
  unreadNotificationCount: Int!
  
  """
  Get plans for a project
  """
  getProjectPlans(project_id: String!): [Plan!]!
  
  """
  Get the latest plan for a project
  """
  getLatestProjectPlan(project_id: String!): Plan
  
  """
  Get a specific plan by ID
  """
  getPlan(id: String!): Plan
}

# Mutations

type Mutation {
  """
  Register a new user
  """
  register(input: RegisterInput!): AuthPayload!

  """
  Login with email and password
  """
  login(email: String!, password: String!): AuthPayload!

  """
  Refresh authentication token
  """
  refreshToken(refreshToken: String!): AuthPayload!

  """
  Create a new project
  """
  createProject(input: CreateProjectInput!): Project!

  """
  Update project details
  """
  updateProject(
    projectId: ID!
    input: UpdateProjectInput!
  ): Project!

  """
  Add member to project
  """
  addProjectMember(input: AddProjectMemberInput!): ProjectMember!

  """
  Add member to project by email
  """
  addProjectMemberByEmail(projectId: ID!, email: String!, role: ProjectRole!): ProjectMember!

  """
  Update project member role
  """
  updateProjectMember(projectId: ID!, userId: ID!, role: ProjectRole!): ProjectMember!

  """
  Remove member from project
  """
  removeProjectMember(projectId: ID!, userId: ID!): Boolean!

  """
  Create a new task
  """
  createTask(input: CreateTaskInput!): Task!

  """
  Update task details
  """
  updateTask(
    taskId: ID!
    title: String
    description: String
    status: TaskStatus
    priority: TaskPriority
    startDate: DateTime
    deadline: DateTime
    assigneeId: ID
    priorityOrder: Int
    type: String
    category: String
    progressType: TaskProgressType
    tags: [String!]
  ): Task!

  """
  Delete task from project
  """
  deleteTask(taskId: ID!): Boolean!

  """
  Assign task to user
  """
  assignTask(taskId: ID!, userId: ID!): Task!

  """
  Add comment to task
  """
  createComment(input: CreateCommentInput!): Comment!

  """
  Upload file attachment
  """
  uploadAttachment(taskId: ID!, file: Upload!): Attachment!

  """
  Delete attachment
  """
  deleteAttachment(attachmentId: ID!): ID!

  """
  Mark notification as read
  """
  markNotificationAsRead(notificationId: ID!): Notification!

  """
  Mark all notifications as read
  """
  markAllNotificationsAsRead: Boolean!

  """
  Update task priority order
  """
  updateTaskPriorityOrder(taskId: ID!, newOrder: Int!): Task!

  """
  Reorder multiple tasks at once
  """
  reorderTasks(input: ReorderTasksInput!): [Task!]!
  
  """
  Create a new plan
  """
  createPlan(input: CreatePlanInput!): Plan!
  
  """
  Update an existing plan
  """
  updatePlan(input: UpdatePlanInput!): Plan!
  
  """
  Delete a plan
  """
  deletePlan(id: String!): Boolean!
  
  """
  Set a plan as active
  """
  setPlanActive(id: String!): Plan!
}

# Types

type User {
  userId: ID!
  email: String!
  fullName: String!
  username: String
  avatarUrl: String
  role: UserRole!
  workCapacity: Float!
  createdAt: DateTime!
  updatedAt: DateTime!
}

type Project {
  projectId: ID!
  name: String!
  description: String
  owner: User!
  createdBy: User!
  members: [ProjectMember!]!
  status: ProjectStatus!
  priority: ProjectPriority!
  visibility: ProjectVisibility!
  tags: [String!]!
  progress: Float!
  category: String
  metadata: JSON
  startDate: DateTime
  endDate: DateTime
  iconUrl: String
  isPublic: Boolean!
  memberCount: Int!
  tasks: [Task!]!
  createdAt: DateTime!
  updatedAt: DateTime!
}

type ProjectMember {
  role: ProjectRole!
  joinedAt: DateTime!
  user: User!
}

type Task {
  taskId: ID!
  projectId: ID!
  project: Project!
  parentTaskId: ID
  parentTask: Task
  subtasks: [Task!]!
  title: String!
  description: String
  status: TaskStatus!
  assigneeId: ID
  assignee: UserBasic
  priority: TaskPriority!
  priorityOrder: Int!
  effort: Float
  startDate: DateTime
  dueDate: DateTime
  deadline: DateTime
  createdBy: ID
  creator: UserBasic
  assignees: [User!]!
  comments: [Comment!]!
  attachments: [Attachment!]!
  type: String
  category: String
  progressType: TaskProgressType
  tags: [String!]
  metadata: JSON
  createdAt: DateTime!
  updatedAt: DateTime!
}

type Comment {
  commentId: ID!
  taskId: ID!
  task: Task!
  userId: ID!
  user: User!
  content: String!
  parentCommentId: ID
  parentComment: Comment
  replies: [Comment!]!
  createdAt: DateTime!
  updatedAt: DateTime!
}

type Attachment {
  attachmentId: ID!
  taskId: ID!
  task: Task!
  userId: ID!
  user: User!
  fileName: String!
  fileSize: Int!
  mimeType: String!
  storagePath: String!
  createdAt: DateTime!
}

type Notification {
  notificationId: ID!
  userId: ID!
  type: NotificationType!
  content: JSON!
  createdAt: DateTime!
  readAt: DateTime
}

type AuthPayload {
  accessToken: String!
  refreshToken: String!
  user: User!
}

"""
Plan for Gantt chart task ordering
"""
type Plan {
  id: String!
  project_id: String!
  name: String!
  description: String
  created_by: String!
  created_at: DateTime!
  updated_at: DateTime!
  is_active: Boolean!
  plan_data: PlanData!
}

"""
Data structure for plan
"""
type PlanData {
  tasks: [PlanTaskData!]!
  metadata: PlanMetadata
}

"""
Task data for plan
"""
type PlanTaskData {
  task_id: String!
  priority_order: Int!
  original_priority: String
  start_date: DateTime
  end_date: DateTime
}

"""
Metadata for plan
"""
type PlanMetadata {
  last_sorted_date: DateTime
  sort_criteria: String
}

# Input Types

input RegisterInput {
  email: String!
  password: String!
  name: String!
}

"""
Input for creating a new project
"""
input CreateProjectInput {
  name: String!
  description: String
  status: ProjectStatus = active
  priority: ProjectPriority = medium
  visibility: ProjectVisibility = private
  tags: [String!]
  startDate: DateTime
  endDate: DateTime
  category: String
  metadata: JSON
}

"""
Input for updating project details
"""
input UpdateProjectInput {
  name: String
  description: String
  status: ProjectStatus
  priority: ProjectPriority
  visibility: ProjectVisibility
  tags: [String!]
  startDate: DateTime
  endDate: DateTime
  category: String
  metadata: JSON
}

input AddProjectMemberInput {
  projectId: ID!
  userId: ID!
  role: ProjectRole!
}

input CreateTaskInput {
  projectId: ID!
  parentTaskId: ID
  title: String!
  description: String
  status: TaskStatus!
  priority: TaskPriority!
  effort: Float
  startDate: DateTime
  deadline: DateTime
  assigneeId: ID
  priorityOrder: Int
  type: String
  category: String
  progressType: TaskProgressType
  tags: [String!]
}

input CreateCommentInput {
  taskId: ID!
  content: String!
  parentCommentId: ID
}

"""
Input for reordering multiple tasks
"""
input ReorderTasksInput {
  projectId: ID!
  taskOrders: [TaskOrderInput!]!
}

"""
Input for specifying task order
"""
input TaskOrderInput {
  taskId: ID!
  priorityOrder: Int!
}

"""
Input for creating a plan
"""
input CreatePlanInput {
  project_id: String!
  name: String!
  description: String
  plan_data: CreatePlanDataInput!
}

"""
Input for updating a plan
"""
input UpdatePlanInput {
  id: String!
  name: String
  description: String
  is_active: Boolean
  plan_data: CreatePlanDataInput
}

"""
Input for plan data
"""
input CreatePlanDataInput {
  tasks: [CreatePlanTaskDataInput!]!
  metadata: CreatePlanMetadataInput
}

"""
Input for plan task data
"""
input CreatePlanTaskDataInput {
  task_id: String!
  priority_order: Int!
  original_priority: String
  start_date: DateTime
  end_date: DateTime
}

"""
Input for plan metadata
"""
input CreatePlanMetadataInput {
  last_sorted_date: DateTime
  sort_criteria: String
}

# Scalars
scalar DateTime
scalar JSON
scalar Upload

type UserBasic {
  userId: ID!
  username: String
  avatarUrl: String
  role: String
}
