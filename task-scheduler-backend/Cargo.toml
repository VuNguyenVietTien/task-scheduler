[package]
name = "task-scheduler-backend"
version = "0.1.0"
edition = "2021"

[dependencies]
actix-web = "4.0"
actix-cors = "0.6"
actix-session = "0.8"
actix-multipart = "0.6"
sea-orm = { version = "0.12", features = ["runtime-tokio-rustls", "sqlx-postgres", "macros"] }
sea-orm-migration = "0.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
dotenv = "0.15"
env_logger = "0.10"
bcrypt = "0.15"
jsonwebtoken = "9.1"
uuid = { version = "1.0", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
lettre = { version = "0.11", features = ["tokio1", "tokio1-native-tls", "builder", "hostname", "smtp-transport", "pool"] }
handlebars = "4.3"
async-trait = "0.1"
mockall = "0.12"
redis = { version = "0.23", features = ["tokio-comp", "connection-manager"] }
reqwest = { version = "0.11", features = ["json"] }
entity = { path = "./entity" }
log = "0.4"
validator = { version = "0.16", features = ["derive"] }
futures-util = "0.3"

[workspace]
members = [".", "entity", "migration"]
