[package]
name = "task-scheduler-backend"
version = "0.1.0"
edition = "2021"

[dependencies]
actix = "0.13"
actix-cors = "0.6.4"
actix-rt = "2.8.0"
actix-session = "0.7"
actix-web = "4.3.1"
actix-web-actors = "4.2"
actix-web-httpauth = "0.8"
async-graphql = { version = "5.0.10", features = ["chrono", "uuid"] }
async-graphql-actix-web = "5.0.10"
async-trait = "0.1.68"
bcrypt = "0.10"
chrono = { version = "0.4.26", features = ["serde"] }
dotenv = "0.15.0"
env_logger = "0.10.0"
futures = "0.3"
futures-util = "0.3"
handlebars = "4.3"
jsonwebtoken = "8.3.0"
lettre = { version = "0.10.4", features = ["tokio1", "native-tls", "tokio1-native-tls"] }
log = "0.4.19"
reqwest = { version = "0.11", features = ["json"] }
rust_decimal = { version = "1.32.0", features = ["db-postgres"] }
rust_decimal_macros = "1.32.0"
serde = { version = "1.0.164", features = ["derive"] }
serde_json = "1.0.99"
sqlx = { version = "0.7.4", features = ["runtime-tokio-native-tls", "postgres", "chrono", "uuid", "json", "macros", "rust_decimal"] }
strum = "0.27.1"
strum_macros = "0.27.1"
thiserror = "1.0.40"
tokio = { version = "1.29.1", features = ["full"] }
uuid = { version = "1.3.4", features = ["serde", "v4"] }
validator = { version = "0.16", features = ["derive"] }
