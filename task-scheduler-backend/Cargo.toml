[package]
name = "task-scheduler-backend"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1.28.2", features = ["full"] }
sea-orm = { version = "0.12", features = ["sqlx-postgres", "runtime-tokio-native-tls", "macros", "debug-print"] }
dotenv = "0.15.0"
entity = { path = "entity" }
migration = { path = "migration" }
uuid = { version = "1.4.1", features = ["v4", "serde"] }
chrono = { version = "0.4.26", features = ["serde"] }
bcrypt = "0.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
jsonwebtoken = "8.1"
actix-web = "4"
actix-cors = "0.6"
env_logger = "0.10"
log = "0.4"

# Email dependencies
lettre = { version = "0.10", features = ["builder", "smtp-transport", "tokio1", "tokio1-native-tls"] }
handlebars = "4.3"

# Firebase Admin SDK
firebase-admin-sdk = "0.4"
reqwest = { version = "0.11", features = ["json"] }

# Session management
redis = { version = "0.23", features = ["tokio-comp"] }
async-session = "3.0"

# Testing
mockall = "0.11"
async-trait = "0.1"
