[package]
name = "task-scheduler-backend"
version = "0.1.0"
edition = "2021"

[lib]
name = "task_scheduler_backend"
path = "src/lib.rs"

[workspace]
members = ["entity"]

[dependencies]
actix-cors = "0.6"
actix-web = "4"
actix-web-actors = "4.1"
actix = "0.13"
async-graphql = { version = "5.0.10", features = ["chrono", "uuid"] }
async-graphql-actix-web = "5.0.10"
async-trait = "0.1.74"
chrono = { version = "0.4", features = ["serde"] }
dotenv = "0.15"
env_logger = "0.10"
jsonwebtoken = "9.1"
log = "0.4"
sea-orm = { version = "0.12", features = ["sqlx-postgres", "runtime-tokio-rustls", "macros", "with-uuid", "with-time", "with-json"] }
sea-orm-migration = "0.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1.6", features = ["serde", "v4"] }
strum = "0.25"
strum_macros = "0.25"
entity = { path = "entity" }
