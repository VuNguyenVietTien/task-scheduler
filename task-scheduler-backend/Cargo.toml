[package]
name = "task-scheduler-backend"
version = "0.1.0"
edition = "2021"

[dependencies]
actix-cors = "0.6"
actix-web = "4"
actix-web-actors = "4.2"
actix = "0.13"
async-graphql = { version = "5.0", features = ["chrono", "uuid", "dataloader"] }
async-graphql-actix-web = "5.0"
chrono = { version = "0.4", features = ["serde"] }
dotenv = "0.15"
env_logger = "0.10"
futures = "0.3"
jsonwebtoken = "8.3"
log = "0.4"
parking_lot = "0.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sea-orm = { version = "0.12", features = ["sqlx-postgres", "runtime-actix-native-tls", "macros", "mock"] }
sea-orm-migration = "0.12"
thiserror = "1.0"
tokio = { version = "1.0", features = ["full"] }
uuid = { version = "1.0", features = ["serde", "v4"] }
async-trait = "0.1"
sanitize-filename = "0.4"
lettre = { version = "0.10", features = ["smtp-transport", "tokio1", "tokio1-native-tls"] }
handlebars = "4.3"

[dev-dependencies]
mockall = "0.11"
tokio-test = "0.4"

[workspace]
members = [".", "entity", "migration"]
