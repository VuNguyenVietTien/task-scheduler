[package]
name = "task-scheduler-backend"
version = "0.1.0"
edition = "2021"
default-run = "task-scheduler-backend"

[dependencies]
actix-web = "4"
actix-cors = "0.6"
sea-orm = { version = "^0.12", features = ["sqlx-postgres", "runtime-actix-native-tls", "macros", "with-chrono", "with-json", "with-uuid"] }
sea-orm-migration = "^0.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
dotenv = "0.15"
uuid = { version = "1.3", features = ["serde", "v4"] }
chrono = { version = "0.4", features = ["serde"] }
entity = { path = "entity" }
validator = { version = "0.16", features = ["derive"] }
firebase-auth = { version = "0.3.0" }
log = "0.4"
env_logger = "0.10"
async-trait = "0.1"
colored = "2.0"
futures = "0.3"
futures-util = "0.3"
actix-web-httpauth = "0.8.1"
actix-service = "2.0.2"
jsonwebtoken = "8.1.1"
bcrypt = "0.10"
handlebars = "4.3"
lettre = { version = "0.10", features = ["smtp-transport", "tokio1-native-tls"] }
reqwest = { version = "0.11", features = ["json"] }

[[bin]]
name = "task-scheduler-backend"
path = "src/main.rs"

[[bin]]
name = "migration"
path = "migration/src/main.rs"

[workspace]
members = [".", "entity", "migration"]
