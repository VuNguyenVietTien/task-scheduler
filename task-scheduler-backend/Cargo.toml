[package]
name = "task-scheduler-backend"
version = "0.1.0"
edition = "2021"

[dependencies]
# Web framework
actix-web = "4.4.0"
actix-cors = "0.6.4"
actix-service = "2.0.2"
actix-session = "0.7.2"
actix = "0.13.1"
actix-web-actors = "4.2.0"
handlebars = "4.3.7"
reqwest = { version = "0.11", features = ["json"] }

# Database
sqlx = { version = "0.7", features = ["runtime-tokio-native-tls", "postgres", "uuid", "chrono", "json"] }
redis = { version = "0.23.3", features = ["tokio-comp"] }

# GraphQL
async-graphql = { version = "5.0.10", features = ["chrono", "uuid"] }
async-graphql-actix-web = "5.0.10"

# Authentication & Security
jsonwebtoken = "8.3.0"
bcrypt = "0.10"
argon2 = "0.5.2"

# Async runtime
tokio = { version = "1.33.0", features = ["full"] }
futures = "0.3"
async-trait = "0.1.74"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# UUID handling
uuid = { version = "1.5.0", features = ["serde", "v4"] }

# Time
chrono = { version = "0.4", features = ["serde"] }

# Logging & Error Handling
log = "0.4"
env_logger = "0.10.0"
thiserror = "1.0"

# Validation
validator = { version = "0.16", features = ["derive"] }

# Email
lettre = { version = "0.10", features = ["tokio1", "tokio1-native-tls"] }

# Environment
dotenv = "0.15.0"

# Utilities
futures-util = "0.3"
once_cell = "1.8"
parking_lot = "0.12"
regex = "1.10.2"
lazy_static = "1.4.0"

[dev-dependencies]
tokio-test = "0.4"
pretty_assertions = "1.4.0"
fake = { version = "2.9", features = ["derive"] }
